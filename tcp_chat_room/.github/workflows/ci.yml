name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  build-test:
    name: Build & Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake -S . -B build -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  asan:
    name: ASan & UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan -j

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, asan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Package
        run: |
          mkdir -p pkg/tcp_chat_room-${{ github.ref_name }}
          cp build/chat_server build/chat_client pkg/tcp_chat_room-${{ github.ref_name }}/
          tar czf "tcp_chat_room-${{ github.ref_name }}-linux-amd64.tar.gz" -C pkg "tcp_chat_room-${{ github.ref_name }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" tcp_chat_room-*.tar.gz --generate-notes --title "${{ github.ref_name }}"
