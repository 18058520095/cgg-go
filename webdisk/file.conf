# Web网盘v1 下载服务(nginx)配置
# 启动方式: nginx -c /root/go_lib/webdisk/file.conf
user  root;
worker_processes  1;
pid  /tmp/nginx_cloudisk.pid;
error_log  /tmp/nginx_cloudisk_error.log;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /tmp/nginx_cloudisk_access.log  main;

    sendfile          on;
    keepalive_timeout 65;

    server {
        listen       8080;
        server_name  localhost;

        location / {
            # 与 CloudiskServer.h 中的 cloudisk::FILES_DIR 保持一致
            root /root/go_lib/webdisk/tmp;
            # 浏览器按原始文件名保存（home.html 使用 download 属性，这里再兜底一次）
            add_header Content-Disposition "attachment" always;
        }
    }
}
