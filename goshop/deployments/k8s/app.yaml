apiVersion: apps/v1
kind: Deployment
metadata:
  name: goshop-app
  namespace: goshop
  labels:
    app: goshop-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: goshop-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: goshop-app
    spec:
      containers:
        - name: goshop-app
          image: goshop:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: goshop-config
            - secretRef:
                name: goshop-secret
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: goshop-app
  namespace: goshop
  labels:
    app: goshop-app
spec:
  selector:
    app: goshop-app
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goshop-ingress
  namespace: goshop
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: goshop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goshop-app
                port:
                  number: 8080
