apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: goshop-mysql-pvc
  namespace: goshop
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goshop-mysql
  namespace: goshop
  labels:
    app: goshop-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goshop-mysql
  template:
    metadata:
      labels:
        app: goshop-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: goshop-secret
                  key: DB_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: goshop-config
                  key: DB_NAME
            - name: TZ
              value: Asia/Shanghai
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$(MYSQL_ROOT_PASSWORD)"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$(MYSQL_ROOT_PASSWORD)"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: goshop-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: goshop-mysql
  namespace: goshop
spec:
  selector:
    app: goshop-mysql
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None
