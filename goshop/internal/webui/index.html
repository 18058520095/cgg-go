<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoShop 商城</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --text:#1f2329; --muted:#8a919e;
    --primary:#2f6bff; --primary-d:#1f52d6; --border:#e6e8ec;
    --danger:#e5484d; --ok:#12a150;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;gap:16px}
  .logo{font-weight:700;font-size:20px;color:var(--primary);letter-spacing:.5px;cursor:pointer}
  .search{flex:1;max-width:420px;display:flex;gap:8px}
  input,select,textarea{font:inherit;padding:9px 12px;border:1px solid var(--border);border-radius:8px;outline:none;background:#fff;color:var(--text);width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--primary)}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:9px 16px;background:var(--primary);color:#fff;transition:.15s}
  button:hover{background:var(--primary-d)}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
  button.ghost:hover{background:#f0f2f5}
  button.sm{padding:5px 10px;font-size:13px}
  button.danger{background:var(--danger)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .spacer{flex:1}
  .user-box{display:flex;align-items:center;gap:10px;font-size:14px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600}
  main{max-width:1180px;margin:0 auto;padding:24px}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .tabs{display:flex;gap:8px}
  .tab{padding:8px 16px;border-radius:8px;background:#fff;border:1px solid var(--border);cursor:pointer;font-size:14px}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:.15s}
  .card:hover{box-shadow:0 6px 20px rgba(20,30,60,.08);transform:translateY(-2px)}
  .thumb{height:140px;background:linear-gradient(135deg,#e8efff,#dfe7ff);display:grid;place-items:center;font-size:34px;color:#9db4ff}
  .card-body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .name{font-weight:600;font-size:15px}
  .desc{color:var(--muted);font-size:13px;line-height:1.5;height:40px;overflow:hidden}
  .row{display:flex;align-items:center;justify-content:space-between}
  .price{color:var(--danger);font-weight:700;font-size:17px}
  .stock{color:var(--muted);font-size:12px}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;background:#eef3ff;color:var(--primary);font-size:12px}
  .pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:24px 0;color:var(--muted);font-size:14px}
  .empty{padding:56px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--border);border-radius:12px}
  /* 抽屉 */
  .drawer-mask{position:fixed;inset:0;background:rgba(15,20,35,.42);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .drawer-mask.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:-460px;width:460px;max-width:92vw;height:100%;background:#fff;z-index:50;transition:.25s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(20,30,60,.14)}
  .drawer.show{right:0}
  .drawer-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .drawer-body{flex:1;overflow:auto;padding:16px 20px}
  .drawer-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
  .cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f0f2f5;align-items:center}
  .cart-item .info{flex:1;min-width:0}
  .cart-item .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qty{display:flex;align-items:center;gap:6px}
  .qty button{padding:2px 9px;background:#f0f2f5;color:var(--text)}
  .qty button:hover{background:#e3e6eb}
  .qty span{min-width:24px;text-align:center;font-size:14px}
  /* 弹窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(15,20,35,.45);display:none;place-items:center;z-index:60}
  .modal-mask.show{display:grid}
  .modal{background:#fff;border-radius:14px;padding:24px;width:420px;max-width:92vw;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 18px;font-size:18px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}
  .msg.err{display:block;background:#fdecec;color:var(--danger)}
  .msg.ok{display:block;background:#e9f8ef;color:var(--ok)}
  /* 订单 */
  .order{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
  .order-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #f0f2f5;font-size:13px;color:var(--muted)}
  .order-no{font-family:ui-monospace,monospace;color:var(--text)}
  .order-item{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
  .status{padding:3px 10px;border-radius:999px;font-size:12px}
  .s1{background:#fff4e5;color:#b25e00}.s2{background:#e9f8ef;color:#12a150}
  .s3{background:#eef3ff;color:#2f6bff}.s4{background:#f0f2f5;color:#5b6472}
  .s5{background:#fdecec;color:#e5484d}
  .toast{position:fixed;left:50%;top:24px;transform:translate(-50%,-20px);background:#1f2329;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:.25s;z-index:80;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:640px){header{padding:0 14px;gap:10px}.search{max-width:none}main{padding:16px}}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="switchTab('products')">GoShop</div>
  <div class="search">
    <input id="kw" placeholder="搜索商品名称 / 描述" onkeydown="if(event.key==='Enter')loadProducts(1)">
    <button class="sm" onclick="loadProducts(1)">搜索</button>
  </div>
  <div class="spacer"></div>
  <div id="userArea" class="user-box"></div>
  <button class="ghost" onclick="openCart()">购物车 <span id="cartCount" class="tag">0</span></button>
</header>

<main>
  <div class="toolbar">
    <div class="tabs">
      <div id="tab-products" class="tab active" onclick="switchTab('products')">商品</div>
      <div id="tab-orders" class="tab" onclick="switchTab('orders')">我的订单</div>
    </div>
    <div class="spacer"></div>
    <button id="btnNewProduct" class="sm" style="display:none" onclick="openProductForm()">上架商品</button>
  </div>

  <section id="view-products">
    <div id="productGrid" class="grid"></div>
    <div id="productPager" class="pager"></div>
  </section>

  <section id="view-orders" style="display:none">
    <div id="orderList"></div>
    <div id="orderPager" class="pager"></div>
  </section>
</main>

<!-- 购物车抽屉 -->
<div id="cartMask" class="drawer-mask" onclick="closeCart()"></div>
<aside id="cartDrawer" class="drawer">
  <div class="drawer-head">
    <strong>购物车</strong>
    <button class="ghost sm" onclick="closeCart()">关闭</button>
  </div>
  <div id="cartBody" class="drawer-body"></div>
  <div class="drawer-foot">
    <div class="row"><span style="color:var(--muted)">合计</span><strong id="cartTotal" class="price">¥0.00</strong></div>
    <button id="btnCheckout" onclick="openCheckout()">结算选中商品</button>
  </div>
</aside>

<!-- 登录 / 注册 -->
<div id="authModal" class="modal-mask">
  <div class="modal">
    <h3 id="authTitle">登录</h3>
    <div id="authMsg" class="msg"></div>
    <div class="field"><label>用户名</label><input id="authUser" placeholder="3-50 位"></div>
    <div class="field" id="emailField" style="display:none"><label>邮箱</label><input id="authEmail" placeholder="选填"></div>
    <div class="field"><label>密码</label><input id="authPass" type="password" placeholder="至少 6 位"></div>
    <div class="modal-actions">
      <button class="ghost" onclick="toggleAuthMode()" id="authSwitch">没有账号？去注册</button>
      <button onclick="submitAuth()" id="authSubmit">登录</button>
    </div>
  </div>
</div>

<!-- 结算 -->
<div id="checkoutModal" class="modal-mask">
  <div class="modal">
    <h3>填写收货信息</h3>
    <div id="checkoutMsg" class="msg"></div>
    <div class="field"><label>收货人</label><input id="shipName" placeholder="张三"></div>
    <div class="field"><label>手机号</label><input id="shipPhone" placeholder="13800138000"></div>
    <div class="field"><label>收货地址</label><input id="shipAddr" placeholder="北京市朝阳区..."></div>
    <div class="field"><label>备注（选填）</label><input id="shipRemark" placeholder=""></div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal('checkoutModal')">取消</button>
      <button onclick="submitCheckout()">提交订单</button>
    </div>
  </div>
</div>

<!-- 上架商品（管理员） -->
<div id="productModal" class="modal-mask">
  <div class="modal">
    <h3>上架商品</h3>
    <div id="productMsg" class="msg"></div>
    <div class="field"><label>名称</label><input id="pName" placeholder="机械键盘"></div>
    <div class="field"><label>描述</label><input id="pDesc" placeholder="87键 青轴"></div>
    <div class="field"><label>价格</label><input id="pPrice" type="number" step="0.01" placeholder="299.00"></div>
    <div class="field"><label>库存</label><input id="pStock" type="number" placeholder="50"></div>
    <div class="field"><label>分类 ID</label><input id="pCategory" type="number" value="1"></div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal('productModal')">取消</button>
      <button onclick="submitProduct()">确认上架</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API = '/api/v1';
const state = {
  token: localStorage.getItem('goshop_token') || '',
  user: JSON.parse(localStorage.getItem('goshop_user') || 'null'),
  page: 1, pageSize: 8, keyword: '',
  ordersPage: 1,
  cart: []
};

/* ---------- 基础工具 ---------- */
function toast(text){
  const el = document.getElementById('toast');
  el.textContent = text; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 1800);
}
async function api(path, {method='GET', body, auth=false} = {}){
  const headers = {'Content-Type':'application/json'};
  if (auth && state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API + path, {
    method, headers, body: body ? JSON.stringify(body) : undefined
  });
  const json = await res.json().catch(()=>({code:-1,message:'响应解析失败'}));
  if (json.code !== 0) {
    if (res.status === 401) { logout(false); }
    throw new Error(json.message || '请求失败');
  }
  return json.data;
}
const money = n => '¥' + Number(n).toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 登录态 ---------- */
function renderUser(){
  const area = document.getElementById('userArea');
  document.getElementById('btnNewProduct').style.display =
    (state.user && state.user.role === 'admin') ? 'inline-block' : 'none';

  if (state.user) {
    area.innerHTML = `
      <div class="avatar">${esc(state.user.username.slice(0,1).toUpperCase())}</div>
      <span>${esc(state.user.username)}${state.user.role==='admin'?' <span class="tag">管理员</span>':''}</span>
      <button class="ghost sm" onclick="logout()">退出</button>`;
  } else {
    area.innerHTML = `<button class="sm" onclick="openAuth()">登录 / 注册</button>`;
  }
}
let authMode = 'login';
function openAuth(){ document.getElementById('authModal').classList.add('show'); }
function toggleAuthMode(){
  authMode = authMode === 'login' ? 'register' : 'login';
  const isReg = authMode === 'register';
  document.getElementById('authTitle').textContent = isReg ? '注册' : '登录';
  document.getElementById('authSubmit').textContent = isReg ? '注册' : '登录';
  document.getElementById('authSwitch').textContent = isReg ? '已有账号？去登录' : '没有账号？去注册';
  document.getElementById('emailField').style.display = isReg ? 'block' : 'none';
  document.getElementById('authMsg').className = 'msg';
}
function authTip(text, ok=false){
  const el = document.getElementById('authMsg');
  el.className = 'msg ' + (ok ? 'ok' : 'err'); el.textContent = text;
}
async function submitAuth(){
  const username = document.getElementById('authUser').value.trim();
  const password = document.getElementById('authPass').value;
  const email = document.getElementById('authEmail').value.trim();
  if (!username || !password) return authTip('用户名和密码不能为空');

  try{
    if (authMode === 'register'){
      await api('/auth/register', {method:'POST', body:{username, password, email}});
      authTip('注册成功，正在登录…', true);
    }
    const data = await api('/auth/login', {method:'POST', body:{username, password}});
    state.token = data.token; state.user = data.user;
    localStorage.setItem('goshop_token', state.token);
    localStorage.setItem('goshop_user', JSON.stringify(state.user));
    closeModal('authModal');
    renderUser(); loadCartCount();
    toast('欢迎，' + state.user.username);
  }catch(e){ authTip(e.message); }
}
function logout(notify=true){
  state.token=''; state.user=null;
  localStorage.removeItem('goshop_token'); localStorage.removeItem('goshop_user');
  renderUser(); document.getElementById('cartCount').textContent='0';
  if (notify) toast('已退出登录');
}

/* ---------- 商品 ---------- */
async function loadProducts(page=1){
  state.keyword = document.getElementById('kw').value.trim();
  state.page = page;
  const q = new URLSearchParams({page, page_size: state.pageSize});
  if (state.keyword) q.set('keyword', state.keyword);

  const grid = document.getElementById('productGrid');
  grid.innerHTML = '<div class="empty">加载中…</div>';
  try{
    const data = await api('/products?' + q.toString());
    if (!data.list.length){
      grid.innerHTML = '<div class="empty">暂无商品</div>';
      document.getElementById('productPager').innerHTML = '';
      return;
    }
    grid.innerHTML = data.list.map(p => `
      <div class="card">
        <div class="thumb">${p.image ? `<img src="${esc(p.image)}" style="width:100%;height:100%;object-fit:cover">` : '🛍'}</div>
        <div class="card-body">
          <div class="row"><span class="name">${esc(p.name)}</span>${p.category?.name?`<span class="tag">${esc(p.category.name)}</span>`:''}</div>
          <div class="desc">${esc(p.description || '暂无描述')}</div>
          <div class="row">
            <span class="price">${money(p.price)}</span>
            <span class="stock">库存 ${p.stock}</span>
          </div>
          <button class="sm" ${p.stock<=0?'disabled':''} onclick="addToCart(${p.id})">
            ${p.stock<=0?'已售罄':'加入购物车'}
          </button>
        </div>
      </div>`).join('');

    const totalPages = Math.max(1, Math.ceil(data.total / data.page_size));
    document.getElementById('productPager').innerHTML = `
      <button class="ghost sm" ${page<=1?'disabled':''} onclick="loadProducts(${page-1})">上一页</button>
      <span>第 ${page} / ${totalPages} 页 · 共 ${data.total} 件</span>
      <button class="ghost sm" ${page>=totalPages?'disabled':''} onclick="loadProducts(${page+1})">下一页</button>`;
  }catch(e){
    grid.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

/* ---------- 购物车 ---------- */
async function addToCart(productId){
  if (!state.token) return openAuth();
  try{
    await api('/cart', {method:'POST', body:{product_id: productId, quantity: 1}, auth:true});
    toast('已加入购物车');
    loadCartCount();
    if (document.getElementById('cartDrawer').classList.contains('show')) loadCart();
  }catch(e){ toast(e.message); }
}
async function loadCartCount(){
  if (!state.token){ document.getElementById('cartCount').textContent = '0'; return; }
  try{
    const items = await api('/cart', {auth:true});
    state.cart = items;
    document.getElementById('cartCount').textContent =
      items.reduce((s,i)=>s+i.quantity, 0);
  }catch(_){}
}
function openCart(){
  if (!state.token) return openAuth();
  document.getElementById('cartDrawer').classList.add('show');
  document.getElementById('cartMask').classList.add('show');
  loadCart();
}
function closeCart(){
  document.getElementById('cartDrawer').classList.remove('show');
  document.getElementById('cartMask').classList.remove('show');
}
async function loadCart(){
  const body = document.getElementById('cartBody');
  try{
    const items = await api('/cart', {auth:true});
    state.cart = items;
    document.getElementById('cartCount').textContent = items.reduce((s,i)=>s+i.quantity,0);
    if (!items.length){
      body.innerHTML = '<div class="empty">购物车是空的</div>';
      updateCartTotal(); return;
    }
    body.innerHTML = items.map(i => `
      <div class="cart-item">
        <input type="checkbox" class="ck" data-id="${i.id}" data-price="${i.product.price}" data-qty="${i.quantity}" checked onchange="updateCartTotal()">
        <div class="info">
          <div class="t">${esc(i.product.name)}</div>
          <div class="price" style="font-size:14px">${money(i.product.price)}</div>
        </div>
        <div class="qty">
          <button onclick="changeQty(${i.id}, ${i.quantity-1})">−</button>
          <span>${i.quantity}</span>
          <button onclick="changeQty(${i.id}, ${i.quantity+1})">+</button>
        </div>
        <button class="ghost sm" onclick="removeItem(${i.id})">删除</button>
      </div>`).join('');
    updateCartTotal();
  }catch(e){ body.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function updateCartTotal(){
  const total = [...document.querySelectorAll('#cartBody .ck')]
    .filter(c=>c.checked)
    .reduce((s,c)=> s + Number(c.dataset.price) * Number(c.dataset.qty), 0);
  document.getElementById('cartTotal').textContent = money(total);
}
async function changeQty(id, qty){
  if (qty < 1) return removeItem(id);
  try{ await api('/cart/'+id, {method:'PUT', body:{quantity:qty}, auth:true}); loadCart(); }
  catch(e){ toast(e.message); }
}
async function removeItem(id){
  try{ await api('/cart/'+id, {method:'DELETE', auth:true}); loadCart(); toast('已移除'); }
  catch(e){ toast(e.message); }
}
let checkoutIDs = [];
function openCheckout(){
  const ids = [...document.querySelectorAll('#cartBody .ck')].filter(c=>c.checked).map(c=>Number(c.dataset.id));
  if (!ids.length) return toast('请先选择要结算的商品');
  checkoutIDs = ids;
  closeCart(); openModal('checkoutModal');
}
async function submitCheckout(){
  const name = document.getElementById('shipName').value.trim();
  const phone = document.getElementById('shipPhone').value.trim();
  const addr = document.getElementById('shipAddr').value.trim();
  const remark = document.getElementById('shipRemark').value.trim();
  const msg = document.getElementById('checkoutMsg');
  if (!name || !phone || !addr){ msg.className='msg err'; msg.textContent='收货人、手机号、地址均必填'; return; }
  try{
    const order = await api('/orders', {method:'POST', auth:true, body:{
      cart_item_ids: checkoutIDs, shipping_name: name,
      shipping_phone: phone, shipping_addr: addr, remark
    }});
    closeModal('checkoutModal');
    toast('下单成功，订单号 ' + order.order_no);
    loadCartCount(); loadOrders(1); switchTab('orders');
  }catch(e){ msg.className='msg err'; msg.textContent = e.message; }
}

/* ---------- 订单 ---------- */
const STATUS = {1:['待支付','s1'],2:['已支付','s2'],3:['已发货','s3'],4:['已完成','s4'],5:['已取消','s5']};
async function loadOrders(page=1){
  if (!state.token) return openAuth();
  state.ordersPage = page;
  const list = document.getElementById('orderList');
  list.innerHTML = '<div class="empty">加载中…</div>';
  try{
    const data = await api(`/orders?page=${page}&page_size=5`, {auth:true});
    if (!data.list.length){
      list.innerHTML = '<div class="empty">还没有订单</div>';
      document.getElementById('orderPager').innerHTML = '';
      return;
    }
    list.innerHTML = data.list.map(o => {
      const [txt, cls] = STATUS[o.status] || ['未知','s4'];
      return `
        <div class="order">
          <div class="order-head">
            <span>订单号 <span class="order-no">${esc(o.order_no)}</span></span>
            <span class="status ${cls}">${txt}</span>
          </div>
          ${o.items.map(it=>`
            <div class="order-item">
              <span>${esc(it.name)} × ${it.quantity}</span>
              <span>${money(it.price * it.quantity)}</span>
            </div>`).join('')}
          <div class="row" style="margin-top:12px">
            <span style="color:var(--muted);font-size:13px">${esc(o.shipping_name)} ${esc(o.shipping_phone)} · ${esc(o.shipping_addr)}</span>
            <span>
              <strong class="price">${money(o.total_amount)}</strong>
              ${o.status===1?`<button class="danger sm" style="margin-left:10px" onclick="cancelOrder(${o.id})">取消订单</button>`:''}
            </span>
          </div>
        </div>`;
    }).join('');

    const totalPages = Math.max(1, Math.ceil(data.total / data.page_size));
    document.getElementById('orderPager').innerHTML = `
      <button class="ghost sm" ${page<=1?'disabled':''} onclick="loadOrders(${page-1})">上一页</button>
      <span>第 ${page} / ${totalPages} 页</span>
      <button class="ghost sm" ${page>=totalPages?'disabled':''} onclick="loadOrders(${page+1})">下一页</button>`;
  }catch(e){ list.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function cancelOrder(id){
  if (!confirm('确定取消该订单？库存将自动恢复。')) return;
  try{ await api(`/orders/${id}/cancel`, {method:'POST', auth:true}); toast('订单已取消'); loadOrders(state.ordersPage); loadProducts(state.page); }
  catch(e){ toast(e.message); }
}

/* ---------- 管理员：上架商品 ---------- */
function openProductForm(){ openModal('productModal'); }
async function submitProduct(){
  const msg = document.getElementById('productMsg');
  const body = {
    name: document.getElementById('pName').value.trim(),
    description: document.getElementById('pDesc').value.trim(),
    price: Number(document.getElementById('pPrice').value),
    stock: Number(document.getElementById('pStock').value),
    category_id: Number(document.getElementById('pCategory').value)
  };
  if (!body.name || !(body.price > 0)){ msg.className='msg err'; msg.textContent='名称与价格（>0）必填'; return; }
  try{
    await api('/admin/products', {method:'POST', auth:true, body});
    closeModal('productModal'); toast('上架成功'); loadProducts(1);
  }catch(e){ msg.className='msg err'; msg.textContent = e.message; }
}

/* ---------- 视图切换 ---------- */
function switchTab(name){
  document.getElementById('view-products').style.display = name==='products'?'block':'none';
  document.getElementById('view-orders').style.display = name==='orders'?'block':'none';
  document.getElementById('tab-products').classList.toggle('active', name==='products');
  document.getElementById('tab-orders').classList.toggle('active', name==='orders');
  if (name==='orders') loadOrders(1);
}
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-mask').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
});

/* ---------- 启动 ---------- */
renderUser();
loadProducts(1);
loadCartCount();
</script>
